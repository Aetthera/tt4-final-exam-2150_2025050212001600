version: '3.8'

services:
  backend:
    build: ./backend/ExpenseTracker
    ports:
      - "5050:5000"
    volumes:
      - ./backend/ExpenseTracker:/app
    environment:
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend